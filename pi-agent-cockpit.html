<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pi — agent cockpit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0b; --panel:#0d0d0f; --panel2:#101013; --panel3:#131316;
    --fg:#f3f3f3; --text:#cdcdcd; --list:#9a9a9a; --muted:#6c6c6c; --dim:#454549; --faint:#2a2a2e; --hair:#1d1d21; --hair2:#26262b;
    --cyan:#22d3ee; --teal:#2dd4bf; --green:#3ddc6b; --amber:#e0a93b; --purple:#b585e6; --red:#f0584f; --brand:#3ddc6b;
    --mono:"JetBrains Mono",ui-monospace,"Cascadia Code","Fira Code",Consolas,Menlo,monospace;
    --disp:"Space Grotesk","Segoe UI Variable Display",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{background:var(--bg);color:var(--text);font-family:var(--mono);font-size:13px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden}
  body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:linear-gradient(var(--faint) 1px,transparent 1px),linear-gradient(90deg,var(--faint) 1px,transparent 1px);
    background-size:48px 48px;opacity:.16;-webkit-mask-image:radial-gradient(130% 90% at 50% 0%,#000 25%,transparent 92%);mask-image:radial-gradient(130% 90% at 50% 0%,#000 25%,transparent 92%)}
  body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(255,255,255,.015) 0 1px,transparent 1px 3px);mix-blend-mode:overlay}
  .wrap{position:relative;z-index:1;height:100vh;max-width:1060px;margin:0 auto;padding:16px 26px 14px;display:flex;flex-direction:column;gap:10px}

  .disp{font-family:var(--disp)}
  .b{color:var(--fg);font-weight:700}
  .muted{color:var(--muted)} .dim{color:var(--dim)}
  .cyan{color:var(--cyan)} .teal{color:var(--teal)} .green{color:var(--green)}
  .amber{color:var(--amber)} .purple{color:var(--purple)} .red{color:var(--red)} .brand{color:var(--brand)}
  .tnum{font-variant-numeric:tabular-nums}
  .pn{color:var(--muted)} .cur{color:var(--cyan)}

  .legend{position:absolute;top:8px;right:10px;font-family:var(--disp);font-size:8.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);border:1px solid var(--hair);border-radius:20px;padding:2px 8px;background:rgba(10,10,11,.6);backdrop-filter:blur(2px);pointer-events:none}
  .legend.ext{color:#5a8a64;border-color:#21352a}
  /* ride the stack's top border like a fieldset legend — clears the in-row right-aligned controls */
  .stack>.legend.ext{top:-9px;left:14px;right:auto;background:var(--panel);z-index:2}

  /* ===== top bar ===== */
  .topbar{display:flex;align-items:center;gap:14px;flex-shrink:0}
  .logo{display:grid;grid-template-columns:repeat(4,10px);grid-template-rows:repeat(4,10px);gap:2px;flex-shrink:0;cursor:pointer}
  .logo i{display:block;border-radius:1px;background:transparent;transition:background .12s,box-shadow .12s}
  .logo i.lit{box-shadow:0 0 5px -1px currentColor}
  .brand .name{font-family:var(--disp);font-size:22px;font-weight:700;letter-spacing:-.5px;color:var(--fg);line-height:1}
  .brand .name em{font-style:normal;color:var(--brand)}
  .brand .sub{font-family:var(--disp);font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-top:3px}
  .topmeta{margin-left:auto;display:flex;align-items:center;gap:16px;font-size:11px;color:var(--muted)}
  .topmeta b{color:var(--text);font-weight:600}
  .pulse{display:inline-flex;align-items:center;gap:7px;color:var(--green);font-family:var(--disp);font-size:9.5px;letter-spacing:2px;text-transform:uppercase}
  .pulse::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:beat 1.5s ease-in-out infinite}
  .pulse.idle{color:var(--muted)} .pulse.idle::before{background:var(--muted);box-shadow:none;animation:none}
  @keyframes beat{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.5);opacity:.35}}

  /* ===== stage: native conversation stream ===== */
  .stage{position:relative;flex:1 1 auto;min-height:0;overflow-y:auto;padding:6px 4px 6px 2px;scrollbar-width:thin;scrollbar-color:#26262a transparent}
  .stage::-webkit-scrollbar{width:8px} .stage::-webkit-scrollbar-thumb{background:#222226;border-radius:4px}
  .msg{margin:0 0 13px;animation:rise .32s ease both}
  .msg .who{font-family:var(--disp);font-weight:600;font-size:11px;letter-spacing:.5px;margin-right:9px;vertical-align:1px}
  .msg.user .who{color:var(--purple)} .msg.user{color:var(--fg)}
  .msg.asst .who{color:var(--brand)}
  @keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

  .think{margin:2px 0 9px;border-left:2px solid var(--faint);padding-left:11px}
  .think.streaming{border-left-color:var(--amber);animation:breathe 1.8s ease-in-out infinite}
  @keyframes breathe{50%{border-left-color:#5a4420}}
  .think-h{display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none;font-size:10.5px;color:var(--muted);letter-spacing:.5px}
  .think-h .c{color:var(--dim);transition:transform .2s;font-size:9px}
  .think.collapsed .think-h .c{transform:rotate(-90deg)}
  .think-h .lab{font-family:var(--disp);text-transform:uppercase;letter-spacing:1.5px;font-size:9px}
  .think.streaming .think-h .lab{color:var(--amber)}
  .think-b{color:var(--dim);font-style:italic;font-size:12px;white-space:pre-wrap;margin-top:3px;max-height:240px;overflow:hidden;transition:max-height .3s ease,opacity .25s,margin .3s}
  .think.collapsed .think-b{max-height:0;opacity:0;margin-top:0}

  .prose{color:var(--text);white-space:pre-wrap;word-break:break-word;margin:1px 0 4px}
  .caret{display:inline-block;width:7px;height:13px;background:var(--fg);vertical-align:-2px;margin-left:1px;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  .tb{margin:7px 0;border:1px solid var(--hair);border-left:2px solid var(--tc,var(--dim));border-radius:8px;background:var(--panel);overflow:hidden;animation:rise .28s ease both}
  .tb.streaming{box-shadow:0 0 0 1px rgba(255,255,255,.02)}
  .tb-h{display:flex;align-items:center;gap:9px;padding:7px 11px;cursor:pointer;user-select:none;font-size:12px}
  .tb-h .c{color:var(--dim);font-size:9px;transition:transform .2s;width:8px}
  .tb.collapsed .tb-h .c{transform:rotate(-90deg)}
  .tb-h .spin{color:var(--tc);width:13px;text-align:center}
  .tb-h .nm{color:var(--tc);font-weight:600}
  .tb-h .role{font-family:var(--disp);color:var(--tc);font-weight:600}
  .tb-h .ar{color:var(--list);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tb-h .meta{color:var(--muted);font-size:10.5px;display:flex;gap:10px;flex-shrink:0}
  .tb-h .meta .st{font-family:var(--disp);letter-spacing:1px;text-transform:uppercase;font-size:9px}
  .tb-h .meta .st.run{color:var(--tc)} .tb-h .meta .st.ok{color:var(--green)} .tb-h .meta .st.err{color:var(--red)}
  .tb-b{max-height:200px;overflow:hidden;transition:max-height .3s ease;border-top:1px solid var(--hair)}
  .tb.collapsed .tb-b{max-height:0;border-top-color:transparent}
  .tb-body{padding:6px 11px 8px 30px;font-size:11.5px;max-height:150px;overflow-y:auto;scrollbar-width:thin}
  .tb-body::-webkit-scrollbar{width:6px} .tb-body::-webkit-scrollbar-thumb{background:#222226;border-radius:3px}
  .tl{display:flex;align-items:center;gap:8px;padding:1.5px 0;animation:rise .2s ease both}
  .tl .tn{color:var(--muted);min-width:54px}
  .tl .ta{color:var(--dim);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tl .ts{width:13px;text-align:center}
  .ts.run{color:var(--cyan)} .ts.ok{color:var(--green)} .ts.err{color:var(--red)}
  .out{color:var(--list);white-space:pre-wrap;font-size:11px;line-height:1.5}
  .out .ln{color:var(--dim)} .out .ok{color:var(--green)} .out .err{color:var(--red)} .out .add{color:var(--green)} .out .del{color:var(--red)}
  .out .cur{color:var(--cyan)}
  .pbar{height:5px;background:var(--faint);border-radius:3px;overflow:hidden;margin:5px 0 2px}
  .pbar i{display:block;height:100%;width:0;background:var(--cyan);transition:width .12s}

  /* ===== status stack: list-mode blocks, pinned above the input ===== */
  .stack{flex-shrink:0;position:relative;border:1px solid var(--hair2);border-radius:11px;background:linear-gradient(180deg,var(--panel),var(--panel2));padding:8px 12px 9px;transition:border-color .25s,box-shadow .25s}
  .wrap:has(#cmd:focus) .stack{border-color:#2c4034;box-shadow:0 0 0 1px rgba(61,220,107,.10),0 0 24px -12px rgba(61,220,107,.4)}
  .wrap:has(#cmd:focus) .console{border-color:var(--brand);box-shadow:0 0 0 1px rgba(61,220,107,.22),0 0 28px -8px rgba(61,220,107,.42)}

  .sblock{margin-top:9px} .sblock:first-of-type{margin-top:3px}
  .sblock[hidden]{display:none}
  .sb-h{display:flex;align-items:center;gap:9px;margin-bottom:4px}
  .sb-l{font-family:var(--disp);font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:600}
  .sb-r{margin-left:auto;font-size:10.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .sb-r .live{color:var(--green)} .sb-r .live::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--green);margin-right:4px;vertical-align:1px;animation:beat 1.5s infinite}
  .segctl{display:inline-flex;border:1px solid var(--hair);border-radius:5px;overflow:hidden;margin-left:10px}
  .segctl button{background:transparent;border:none;color:var(--dim);font:inherit;font-size:11px;padding:1px 8px;cursor:pointer;line-height:1.4;transition:.15s}
  .segctl button:hover{color:var(--muted)}
  .segctl button.on{color:var(--brand);background:rgba(61,220,107,.1)}

  /* agent list rows */
  .arow{display:grid;grid-template-columns:14px 74px 30px minmax(0,1fr) minmax(0,220px) 34px;align-items:center;gap:9px;padding:3px 8px;border-left:2px solid transparent;border-radius:0 4px 4px 0;font-size:11.5px;transition:background .15s,border-color .15s}
  .arow:hover{background:rgba(255,255,255,.025);border-left-color:var(--ac)}
  .arow .ast{color:var(--ac);text-align:center;font-size:12px}
  .arow .arl{font-family:var(--disp);font-weight:600;color:var(--ac);font-size:11px}
  .arow .arid{color:var(--dim);font-size:10px}
  .arow .artask{color:var(--list);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .arow .artail{color:var(--dim);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .arow .artime{color:var(--muted);font-size:10px;text-align:right}
  .arow.idle .ast{color:var(--dim)} .arow.idle .arl{color:var(--muted)} .arow.idle .artask{color:var(--dim)}
  .acompact{font-size:11px;color:var(--list);padding:3px 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .acompact b{color:var(--text);font-weight:600} .acompact .sep{color:var(--faint)}

  /* todo list rows */
  .trow{display:grid;grid-template-columns:24px 16px minmax(0,1fr);align-items:center;gap:8px;padding:3px 8px;border-left:2px solid transparent;border-radius:0 4px 4px 0;font-size:11.5px;transition:background .15s,border-color .15s}
  .trow:hover{background:rgba(255,255,255,.02)}
  .trow .tn{color:var(--dim);font-size:10px;text-align:right}
  .trow .tk{text-align:center;font-size:11px}
  .trow .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .trow.pending .tk{color:var(--dim)} .trow.pending .tt{color:var(--muted)}
  .trow.prog{background:rgba(34,211,238,.05);border-left-color:var(--cyan)} .trow.prog .tk{color:var(--cyan)} .trow.prog .tt{color:var(--fg);font-weight:600}
  .trow.done .tk{color:var(--green)} .trow.done .tt{color:var(--dim);text-decoration:line-through;text-decoration-color:var(--faint)}
  .trow.blocked .tk{color:var(--red)} .trow.blocked .tt{color:var(--red)}
  .tcompact{display:flex;align-items:center;gap:11px;padding:3px 8px}
  .tcompact .segbar{flex:1 1 auto;display:flex;gap:2px;height:5px;min-width:60px}
  .tcompact .segbar i{flex:1;border-radius:2px;background:var(--faint);position:relative;overflow:hidden;transition:background .3s}
  .tcompact .segbar i.done{background:var(--green)}
  .tcompact .segbar i.prog{background:rgba(34,211,238,.25)}
  .tcompact .segbar i.prog::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(34,211,238,.95),transparent);transform:translateX(-100%);animation:sweep 1.3s linear infinite}
  @keyframes sweep{to{transform:translateX(100%)}}
  .tcompact .now{color:var(--list);font-size:11px;max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tcompact .now b{color:var(--text);font-weight:600}
  .tcompact .pct{font-family:var(--disp);font-size:11px;color:var(--muted)}

  /* ===== console ===== */
  .console{flex-shrink:0;display:flex;align-items:center;gap:12px;padding:12px 15px;border:1px solid var(--hair2);border-radius:11px;background:var(--panel);transition:border-color .25s,box-shadow .25s}
  .console .arrow{color:var(--purple);font-weight:700;font-size:15px}
  .console .blkcur{width:9px;height:16px;background:#d8d8d8;animation:blink 1.05s steps(1) infinite;flex-shrink:0}
  .console:focus-within .blkcur{display:none}
  #cmd{flex:1;background:transparent;border:none;outline:none;color:var(--fg);font:inherit;font-size:13.5px;caret-color:var(--brand)}
  #cmd::placeholder{color:var(--muted)}
  .console .send{font-family:var(--disp);font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);border:1px solid var(--hair2);border-radius:6px;padding:4px 9px;transition:.2s}
  .console:focus-within .send{color:var(--brand);border-color:rgba(61,220,107,.4)}

  /* ===== footbar ===== */
  .footbar{flex-shrink:0;position:relative;display:flex;align-items:center;gap:11px;flex-wrap:wrap;font-size:11px;color:var(--muted);padding-top:2px}
  .footbar .sep{color:var(--faint)}
  .footbar .ctxbar{display:inline-block;width:70px;height:8px;vertical-align:-1px;border-radius:2px;background:var(--faint);overflow:hidden}
  .footbar .ctxbar i{display:block;height:100%;width:0;background:var(--green);transition:width .3s,background .3s}
  .footbar .hb{margin-left:auto;color:var(--green);font-family:var(--disp);font-size:9px;letter-spacing:2px;text-transform:uppercase}
  .footbar .hb::before{content:"●";margin-right:5px;font-size:8px;vertical-align:1px;animation:beat 1.5s infinite}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="logo" id="logo" title="replay boot"></div>
    <div class="brand"><div class="name">p<em>i</em></div><div class="sub">agent cockpit</div></div>
    <div class="topmeta">
      <span>session <b class="tnum">cockpit-01</b></span>
      <span>run <b class="tnum" id="m-run">#0</b></span>
      <span class="pulse idle" id="m-pulse">idle</span>
    </div>
  </div>

  <div class="stage" id="stage"><div class="legend">native stream</div></div>

  <div class="stack" id="stack">
    <div class="legend ext">extension · setWidget ↑</div>

    <div class="sblock" id="agentsBlock" hidden>
      <div class="sb-h">
        <span class="sb-l">agents</span>
        <span class="sb-r"><span class="live tnum" id="agLive">0</span> running</span>
        <div class="segctl" id="agCtl"><button data-m="list" class="on" title="list">≡</button><button data-m="cmp" title="compact">—</button></div>
      </div>
      <div class="sb-list" id="agList"></div>
      <div class="sb-compact" id="agCompact" hidden></div>
    </div>

    <div class="sblock" id="todoBlock" hidden>
      <div class="sb-h">
        <span class="sb-l">todo</span>
        <span class="sb-r tnum"><span id="pdone">0</span>/<span id="ptotal">0</span></span>
        <div class="segctl" id="tdCtl"><button data-m="list" class="on" title="list">≡</button><button data-m="cmp" title="compact">—</button></div>
      </div>
      <div class="sb-list" id="tdList"></div>
      <div class="sb-compact" id="tdCompact" hidden></div>
    </div>
  </div>

  <div class="console">
    <span class="arrow">›</span><span class="blkcur"></span>
    <input id="cmd" autocomplete="off" spellcheck="false" placeholder="dispatch a goal…  explore · fix · review · plan">
    <span class="send">enter ↵</span>
  </div>

  <div class="footbar">
    <div class="legend ext" style="position:static;margin-right:2px">setFooter</div>
    <span class="purple">pi</span><span class="b" style="color:var(--text)">stream-70b</span>
    <span class="sep">·</span><span>ctx</span><span class="ctxbar"><i id="ctxfill"></i></span><span class="tnum" id="ctxpct">0%</span>
    <span class="sep">·</span><span class="tnum" id="fcost">$0.00</span>
    <span class="sep">·</span><span class="tnum" id="ftools">0 tools</span>
    <span class="sep">·</span><span class="tnum" id="felapsed">00:00</span>
    <span class="hb">live</span>
  </div>

</div>

<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const SPIN="⠋⠙⠹⠸⠧⠇";
const ROLE={main:"var(--brand)",explorer:"var(--cyan)",executor:"var(--green)",reviewer:"var(--amber)",planner:"var(--teal)",debugger:"var(--red)"};

/* ---- pi logo (draw once, hold; replay on hover) ---- */
const CELLS=[[1,0,"red",0],[2,0,"red",1],[2,1,"red",2],[3,0,"red",3],[0,0,"cyan",4],[0,1,"cyan",5],[0,2,"cyan",6],[1,2,"cyan",7],[2,3,"green",8],[3,3,"green",9]];
const LC={red:"var(--red)",cyan:"var(--cyan)",green:"var(--green)"};
const logoEl=$("#logo"),LN=[];
for(let r=0;r<4;r++)for(let c=0;c<4;c++){const i=document.createElement("i");const cell=CELLS.find(x=>x[0]===r&&x[1]===c);i.dataset.o=cell?cell[3]:"-1";logoEl.appendChild(i);LN.push(i);}
let logoT=null;
function playLogo(){clearTimeout(logoT);LN.forEach(n=>{n.classList.remove("lit");n.style.background="transparent";n.style.color="";});const seq=[...CELLS].sort((a,b)=>a[3]-b[3]);let k=0;const step=()=>{if(k<seq.length){const n=LN[seq[k][3]];n.style.color=LC[seq[k][2]];n.style.background=LC[seq[k][2]];n.classList.add("lit");k++;logoT=setTimeout(step,80);}else logoT=null;};step();}
logoEl.addEventListener("mouseenter",playLogo);playLogo();

/* ---- global ticks ---- */
let frame=0, runActive=false, runStart=0;
setInterval(()=>{frame++;document.querySelectorAll("[data-spin]").forEach(e=>{e.textContent=SPIN[frame%SPIN.length];});},90);
setInterval(()=>{
  if(runActive){const s=(performance.now()-runStart)/1000;$("#felapsed").textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(Math.floor(s%60)).padStart(2,"0");}
  document.querySelectorAll(".arow[data-start]").forEach(w=>{const s=(performance.now()-(+w.dataset.start))/1000;const t=w.querySelector(".artime");if(t)t.textContent=s<60?Math.round(s)+"s":Math.floor(s/60)+"m"+String(Math.round(s%60)).padStart(2,"0");});
},200);

/* ---- run-scoped timers ---- */
let runId=0, toolCount=0;
const timers=[];
function regInterval(fn,ms){const id=setInterval(fn,ms);timers.push({k:"i",id});return id;}
function clearRunTimers(){timers.forEach(t=>t.k==="i"?clearInterval(t.id):clearTimeout(t.id));timers.length=0;}

const stage=$("#stage");
function scrollStage(){stage.scrollTop=stage.scrollHeight;}

/* ---- typewriter ---- */
async function typeInto(el,text,my,spd=14){
  const caret=document.createElement("span");caret.className="caret";el.after(caret);
  for(const ch of text){if(runId!==my){caret.remove();return false;}el.textContent+=ch;scrollStage();await sleep(spd+rnd(-6,10));}
  caret.remove();return true;
}

/* ---- stream blocks ---- */
function userMsg(t){const d=document.createElement("div");d.className="msg user";d.innerHTML=`<span class="who">you</span><span class="body"></span>`;d.querySelector(".body").textContent=t;stage.appendChild(d);scrollStage();}
function asstMsg(){const d=document.createElement("div");d.className="msg asst";d.innerHTML=`<span class="who">pi</span><span class="body"></span>`;stage.appendChild(d);scrollStage();return d.querySelector(".body");}
function thinkBlock(container){
  const t0=performance.now();
  const w=document.createElement("div");w.className="think streaming";
  w.innerHTML=`<div class="think-h"><span class="c">▾</span><span class="lab">thinking</span></div><div class="think-b"></div>`;
  container.appendChild(w);scrollStage();
  const body=w.querySelector(".think-b");
  w.querySelector(".think-h").addEventListener("click",()=>w.classList.toggle("collapsed"));
  return {el:w,body,seal(ok){w.classList.remove("streaming");w.classList.add("collapsed");const s=((performance.now()-t0)/1000).toFixed(1);w.querySelector(".lab").textContent=(ok?"thought":"thinking")+" · "+s+"s";w.querySelector(".lab").style.color="";}};
}
function proseBlock(container){const p=document.createElement("div");p.className="prose";container.appendChild(p);scrollStage();return p;}
function toolBlock(container,{role,name,arg,color,teammate}){
  const t0=performance.now();
  const w=document.createElement("div");w.className="tb streaming";w.style.setProperty("--tc",color);
  const head=teammate
    ? `<span class="c">▾</span><span class="spin" data-spin>${SPIN[0]}</span><span class="role">${role}</span><span class="ar">${arg}</span>`
    : `<span class="c">▾</span><span class="spin" data-spin>${SPIN[0]}</span><span class="nm">${name}</span><span class="ar">${arg}</span>`;
  w.innerHTML=`<div class="tb-h">${head}<span class="meta"><span class="st run">running</span><span class="tm tnum">0s</span><span class="tc2 tnum">0</span></span></div><div class="tb-b"><div class="tb-body"></div></div>`;
  container.appendChild(w);scrollStage();
  const body=w.querySelector(".tb-body"),tm=w.querySelector(".tm"),tc2=w.querySelector(".tc2"),st=w.querySelector(".st"),spin=w.querySelector(".spin");
  w.querySelector(".tb-h").addEventListener("click",()=>w.classList.toggle("collapsed"));
  const iv=regInterval(()=>{if(w.dataset.done)return;tm.textContent=((performance.now()-t0)/1000).toFixed(0)+"s";},250);
  let n=0;
  return {el:w,body,
    addToolLine(name,arg){n++;tc2.textContent=n;toolCount++;$("#ftools").textContent=toolCount+" tools";$("#fcost").textContent="$"+(toolCount*0.037+0.04).toFixed(2);
      const r=document.createElement("div");r.className="tl";r.innerHTML=`<span class="tn">${name}</span><span class="ta">${arg}</span><span class="ts run" data-spin>${SPIN[0]}</span>`;body.appendChild(r);scrollStage();return r.querySelector(".ts");},
    setOut(html){let o=body.querySelector(".out");if(!o){o=document.createElement("div");o.className="out";body.appendChild(o);}o.innerHTML=html;body.scrollTop=body.scrollHeight;scrollStage();},
    seal(ok,label){w.dataset.done="1";clearInterval(iv);w.classList.remove("streaming");w.classList.add("collapsed");spin.removeAttribute("data-spin");spin.textContent=ok?"✓":"✕";spin.style.color=ok?"var(--green)":"var(--red)";st.className="st "+(ok?"ok":"err");st.textContent=ok?"done":"failed";tm.textContent=((performance.now()-t0)/1000).toFixed(1)+"s";if(label)w.querySelector(".ar").textContent=label;}
  };
}

/* ===== status stack: agents list (list + compact) ===== */
const agentsBlock=$("#agentsBlock"),agList=$("#agList"),agCompact=$("#agCompact"),agLive=$("#agLive");
let agRecords=[], agentsCompact=false;
function agGlyph(status){if(status==="done")return["✓",false];if(status==="idle")return["·",false];if(status==="failed")return["✕",false];return[SPIN[0],true];}
function makeAgentRow(role,id,task,color,isMain){
  const row=document.createElement("div");row.className="arow";row.style.setProperty("--ac",color);
  if(!isMain)row.dataset.start=performance.now();
  row.innerHTML=`<span class="ast" data-spin>${SPIN[0]}</span><span class="arl">${isMain?"pi":role}</span><span class="arid">${isMain?"":id}</span><span class="artask">${isMain?"":task}</span><span class="artail"></span><span class="artime"></span>`;
  const elAst=row.querySelector(".ast"),elTail=row.querySelector(".artail");
  const rec={role,id,task,color,isMain,row,elAst,elTail,status:"running",tail:"",cls:"",removed:false};
  agRecords.push(rec);
  rec.set=function(action,detail,cls){
    rec.status=action;rec.tail=detail||"";rec.cls=cls||"";
    const [g,spin]=agGlyph(action);
    if(spin){elAst.setAttribute("data-spin","");elAst.textContent=SPIN[0];}else{elAst.removeAttribute("data-spin");elAst.textContent=g;}
    const showWord = action!=="running"&&action!=="starting";
    elTail.innerHTML=(showWord?`<span style="color:${cls||'var(--muted)'}">${action}</span> `:"")+(detail||"");
    renderAgents();
  };
  rec.idle=function(){rec.status="idle";row.classList.add("idle");elAst.removeAttribute("data-spin");elAst.textContent="·";elTail.innerHTML="";renderAgents();};
  rec.remove=function(){rec.removed=true;row.remove();agRecords=agRecords.filter(r=>r!==rec);renderAgents();};
  renderAgents();
  return rec;
}
function renderAgents(){
  const running=agRecords.filter(r=>r.status!=="idle"&&r.status!=="done"&&!r.removed).length;
  agLive.textContent=running;
  if(!agRecords.length){agentsBlock.hidden=true;return;}
  agentsBlock.hidden=false;
  if(agentsCompact){
    agList.hidden=true;agCompact.hidden=false;
    const piR=agRecords.find(r=>r.isMain);
    let html=`<span class="acompact"><b>${running}</b> running<span class="sep">·</span><b>${toolCount}</b> tools`;
    if(piR&&piR.status!=="idle")html+=`<span class="sep">·</span>pi: <span style="color:${piR.cls||'var(--list)'}">${piR.status}</span>`;
    else if(piR)html+=`<span class="sep">·</span><span class="muted">pi idle</span>`;
    html+=`</span>`;agCompact.innerHTML=html;
  }else{
    agCompact.hidden=true;agList.hidden=false;
    agList.innerHTML="";agRecords.forEach(r=>agList.appendChild(r.row));
  }
}
$("#agCtl").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;agentsCompact=b.dataset.m==="cmp";[...$("#agCtl").children].forEach(x=>x.classList.toggle("on",x===b));renderAgents();});

/* ===== status stack: todo list (list + compact) ===== */
const todoBlock=$("#todoBlock"),tdList=$("#tdList"),tdCompact=$("#tdCompact");
let plan=[], todoCompact=false;
function renderTodo(){
  const total=plan.length,done=plan.filter(p=>p.s==="done").length;
  $("#pdone").textContent=done;$("#ptotal").textContent=total;
  if(!total){todoBlock.hidden=true;return;}
  todoBlock.hidden=false;
  if(todoCompact){
    tdList.hidden=true;tdCompact.hidden=false;
    const pct=Math.round(done/total*100);
    const cur=plan.find(p=>p.s==="prog"),nxt=plan.find(p=>p.s==="pending");
    const now=cur?`now · <b>${cur.t}</b>`:nxt?`next · <span class="muted">${nxt.t}</span>`:`<span class="green">all ${total} done</span>`;
    let seg=plan.map(p=>`<i class="${p.s==='done'?'done':p.s==='prog'?'prog':''}"></i>`).join("");
    tdCompact.innerHTML=`<div class="tcompact"><div class="segbar">${seg}</div><span class="now">${now}</span><span class="pct tnum">${pct}%</span></div>`;
  }else{
    tdCompact.hidden=true;tdList.hidden=false;
    tdList.innerHTML="";
    plan.forEach((p,i)=>{
      const r=document.createElement("div");r.className="trow "+p.s;
      const ck=p.s==="done"?"✓":p.s==="prog"?`<span data-spin>${SPIN[0]}</span>`:p.s==="blocked"?"!":"·";
      r.innerHTML=`<span class="tn">${String(i+1).padStart(2,"0")}</span><span class="tk">${ck}</span><span class="tt">${p.t}</span>`;
      tdList.appendChild(r);
    });
  }
}
function initPlan(titles){plan=titles.map(t=>({t,s:"pending"}));renderTodo();}
function setPlan(arr,state){arr.forEach(i=>{if(plan[i]&&plan[i].s!=="done")plan[i].s=state;});renderTodo();}
function donePlan(i){if(plan[i]){plan[i].s="done";renderTodo();}}
$("#tdCtl").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;todoCompact=b.dataset.m==="cmp";[...$("#tdCtl").children].forEach(x=>x.classList.toggle("on",x===b));renderTodo();});

/* ===== actor model ===== */
let curMain=null;
function mainActor(){
  const row=makeAgentRow("main","","",ROLE.main,true);
  return {role:"main",row,container:null,
    newMsg(){this.container=asstMsg();},
    thinking(){const tb=thinkBlock(this.container);row.set("thinking","","var(--amber)");return tb;},
    prose(){const p=proseBlock(this.container);row.set("writing","<span class='cur'>▍</span>","var(--cyan)");return p;},
    tool(o){const tb=toolBlock(this.container,{...o,color:o.color||ROLE.main});row.set(o.name,o.arg,ROLE.main);return tb;},
    settle(){row.idle();}
  };
}
function teammateActor(role,id,task){
  const color=ROLE[role]||ROLE.explorer;
  const row=makeAgentRow(role,id,task,color,false);
  const tb=toolBlock(curMain.container,{role,name:role,arg:task,color,teammate:true});
  return {role,row,tb,color,
    toolLine(name,arg){row.set("running",`<span class='pn'>${name}</span> ${arg}`);return tb.addToolLine(name,arg);},
    tail(s){row.set("running",`<span class='cur'>${s}</span>`);},
    setStatus(s){row.set(s,"");},
    seal(ok,label){tb.seal(ok,label);row.remove();}
  };
}

/* ---- streaming output sims ---- */
function streamBash(tb,pill,lines,my){
  return new Promise(res=>{let i=0,acc="";const iv=regInterval(()=>{
    if(runId!==my){clearInterval(iv);res(false);return;}
    if(i<lines.length){const ln=lines[i++];const cls=ln.startsWith("✓")||ln.includes("passed")?"ok":ln.startsWith("✗")||ln.includes("FAIL")||ln.includes("failed")?"err":ln.startsWith("  ")?"ln":"";acc+=`<span class="${cls}">${ln.replace(/</g,"&lt;")}</span>\n`;tb.setOut(acc);if(pill&&pill.tail)pill.tail(ln.trim());}
    else{clearInterval(iv);res(true);}
  },rnd(150,260));});
}
function streamRead(tb,pill,file,total,my){
  return new Promise(res=>{let n=0;const iv=regInterval(()=>{
    if(runId!==my){clearInterval(iv);res(false);return;}
    n=Math.min(total,n+Math.ceil(rnd(8,22)));
    tb.setOut(`<span class="ln">${file}</span>\n<span class="cur">reading… ${n}/${total} lines</span>`);
    if(pill&&pill.tail)pill.tail(`${n}/${total} lines`);
    if(n>=total){clearInterval(iv);tb.setOut(`<span class="ln">${file}</span>\n<span class="ok">✓ ${total} lines</span>`);res(true);}
  },120);});
}
function streamEdit(tb,pill,file,my){
  return new Promise(res=>{const diff=[`<span class="del">- return cached;</span>`,`<span class="add">+ rotate(secret);</span>`,`<span class="add">+ invalidate(old);</span>`];let pct=0,k=0,acc=`<span class="ln">${file}</span>\n`;const iv=regInterval(()=>{
    if(runId!==my){clearInterval(iv);res(false);return;}
    pct=Math.min(100,pct+Math.ceil(rnd(12,26)));
    if(k<diff.length&&pct>k*33+20){acc+=diff[k++]+"\n";}
    tb.setOut(acc+`<div class="pbar"><i style="width:${pct}%"></i></div><span class="cur">writing ${pct}%</span>`);
    if(pill&&pill.tail)pill.tail(`write ${pct}%`);
    if(pct>=100){clearInterval(iv);tb.setOut(acc+`<span class="ok">✓ saved</span>`);res(true);}
  },140);});
}

/* ---- scenarios ---- */
const SC={
  default:{
    plan:["map auth entrypoints","trace jwt verify","design rotation","implement refresh","add unit tests","run suite","summarize"],
    steps:async(my,M)=>{
      let tb=M.thinking();
      await typeInto(tb.body,"the user wants refresh wired in. i need the call graph first — two explorers in parallel, one on entrypoints, one on the verify path, then i implement against the boundary they agree on.",my,12);
      tb.seal(true);
      initPlan(SC.default.plan); setPlan([0,1],"prog");
      let p=M.prose();
      await typeInto(p,"Mapping the auth flow with two explorers in parallel, then I'll implement the rotation and prove it with tests. Plan is live above ↑.",my);
      const a1=teammateActor("explorer","#a1","map auth entrypoints & routes");
      const a2=teammateActor("explorer","#a2","trace jwt verify control flow");
      const runA=async(a,tools)=>{for(const t of tools){if(runId!==my)return false;const s=a.toolLine(t.n,t.a);const ok=await t.run(a,s,my);s.className="ts "+(ok?"ok":"err");s.removeAttribute("data-spin");s.textContent=ok?"✓":"✕";if(!ok)return false;}return true;};
      const [r1,r2]=await Promise.all([
        runA(a1,[{n:"read",a:"src/api/routes.ts",run:(a,s,my)=>streamRead(a.tb,a,"src/api/routes.ts",184,my)},{n:"grep",a:'"authenticate" src/',run:(a,s,my)=>(a.tail('match: middleware/auth.ts:12'),sleep(rnd(400,700)).then(()=>true))},{n:"lsp",a:"references authenticate",run:(a,s,my)=>(a.tail('6 references'),sleep(rnd(400,700)).then(()=>true))}]),
        runA(a2,[{n:"read",a:"src/auth/jwt.ts",run:(a,s,my)=>streamRead(a.tb,a,"src/auth/jwt.ts",142,my)},{n:"lsp",a:"definition verify()",run:(a,s,my)=>(a.tail('jwt.ts:44'),sleep(rnd(400,700)).then(()=>true))},{n:"grep",a:"rotate|secret",run:(a,s,my)=>(a.tail('match: tokens.ts:88'),sleep(rnd(400,700)).then(()=>true))}]),
      ]);
      a1.seal(r1,"3 tools · entrypoints mapped"); donePlan(0);
      a2.seal(r2,"3 tools · verify path traced"); donePlan(1);
      if(runId!==my)return;
      tb=M.thinking();
      await typeInto(tb.body,"both maps agree: the rotation boundary is tokens.ts:88, and nothing invalidates the old secret yet. that's the bug. implementing there.",my,12);
      tb.seal(true);
      setPlan([2],"prog"); donePlan(2); setPlan([3],"prog");
      p=M.prose(); await typeInto(p,"Boundary confirmed. Patching the rotation now and adding a regression test.",my);
      let et=M.tool({name:"edit",arg:"src/auth/tokens.ts"});
      const eok=await streamEdit(et,null,"src/auth/tokens.ts",my); et.seal(eok,"src/auth/tokens.ts · +3 −1");
      if(runId!==my)return; donePlan(3); setPlan([4],"prog");
      let wt=M.tool({name:"write",arg:"tests/refresh.test.ts"});
      const wok=await streamEdit(wt,null,"tests/refresh.test.ts",my); wt.seal(wok,"tests/refresh.test.ts · new");
      if(runId!==my)return; donePlan(4); setPlan([5],"prog");
      let bt=M.tool({name:"bash",arg:"vitest run refresh"});
      const bok=await streamBash(bt,null,["  vitest run refresh","","  · refresh rotates secret on use","  ✗ FAIL  reuse of old token rejected","    AssertionError: expected 401, got 200","","  1 passed, 1 failed"],my);
      if(bok){const s=bt.addToolLine("bash","vitest run refresh · retry");bt.setOut(`<span class="err">  ✗ 1 failed — patching assertion</span>`);await sleep(rnd(500,800));s.className="ts err";s.removeAttribute("data-spin");s.textContent="✕";
        const s2=bt.addToolLine("bash","vitest run refresh");
        const bok2=await streamBash(bt,null,["  vitest run refresh","","  ✓ refresh rotates secret on use","  ✓ reuse of old token rejected","  ✓ concurrent refresh is serialized","","  3 passed"],my);
        s2.className="ts "+(bok2?"ok":"err");s2.removeAttribute("data-spin");s2.textContent=bok2?"✓":"✕";bt.seal(bok2,"vitest · 3 passed");
      } else bt.seal(false,"vitest · aborted");
      if(runId!==my)return; donePlan(5); donePlan(6);
      p=M.prose(); await typeInto(p,"Done — refresh rotation landed in tokens.ts, old secret now invalidated, 3 tests green. Plan complete ↑.",my);
    }
  },
  explore:{plan:["find definitions","find usages","summarize"],steps:async(my,M)=>{
    let tb=M.thinking();await typeInto(tb.body,"read-only cross-search: definitions in one explorer, usages in another, then i merge the graph.",my,12);tb.seal(true);
    initPlan(SC.explore.plan);setPlan([0,1],"prog");
    let p=M.prose();await typeInto(p,"Cross-searching definitions and usages in parallel.",my);
    const a1=teammateActor("explorer","#e1","locate exported definitions");
    const a2=teammateActor("explorer","#e2","locate imports & call sites");
    const r1=await (async()=>{for(const t of [["read","src/auth/index.ts"],["lsp","symbols Auth"],["grep","export function"]]){const s=a1.toolLine(t[0],t[1]);await sleep(rnd(350,600));a1.tail(t[0]+" "+t[1]);s.className="ts ok";s.removeAttribute("data-spin");s.textContent="✓";}return true;})();
    const r2=await (async()=>{for(const t of [["grep",'from "./auth"'],["lsp","references authenticate"],["read","src/server.ts"]]){const s=a2.toolLine(t[0],t[1]);await sleep(rnd(350,600));a2.tail(t[0]+" "+t[1]);s.className="ts ok";s.removeAttribute("data-spin");s.textContent="✓";}return true;})();
    a1.seal(r1,"3 tools");donePlan(0);a2.seal(r2,"3 tools");donePlan(1);
    if(runId!==my)return;p=M.prose();await typeInto(p,"Definitions and usages reconciled — 4 entrypoints, 11 call sites.",my);donePlan(2);
  }},
  fix:{plan:["reproduce","patch rotation","regression test"],steps:async(my,M)=>{
    let tb=M.thinking();await typeInto(tb.body,"reproduce first, then patch, then lock it with a test.",my,12);tb.seal(true);
    initPlan(SC.fix.plan);setPlan([0],"prog");
    let p=M.prose();await typeInto(p,"Reproducing the refresh race, then patching.",my);
    const d=teammateActor("debugger","#d1","reproduce refresh race");
    const s=d.toolLine("bash","vitest run refresh --bail");await streamBash(d.tb,d,["  ✗ FAIL  concurrent refresh drops a token"],my);s.className="ts err";s.removeAttribute("data-spin");s.textContent="✕";d.seal(true,"reproduced");donePlan(0);
    if(runId!==my)return;setPlan([1],"prog");
    let et=M.tool({name:"edit",arg:"src/auth/tokens.ts"});const eok=await streamEdit(et,null,"src/auth/tokens.ts",my);et.seal(eok,"+2 −1");donePlan(1);
    if(runId!==my)return;setPlan([2],"prog");
    let bt=M.tool({name:"bash",arg:"vitest run refresh"});const bok=await streamBash(bt,null,["  ✓ concurrent refresh serialized","","  2 passed"],my);bt.seal(bok,"2 passed");donePlan(2);
    if(runId!==my)return;p=M.prose();await typeInto(p,"Race fixed and locked by a regression test.",my);
  }},
  review:{plan:["collect diff","correctness & security","coverage","report"],steps:async(my,M)=>{
    initPlan(SC.review.plan);setPlan([0],"prog");
    let p=M.prose();await typeInto(p,"Reviewing the diff across correctness, security and coverage.",my);
    let bt=M.tool({name:"bash",arg:"git diff --stat"});await streamBash(bt,null,["  src/auth/tokens.ts   | 12 ++++--","  tests/refresh.test.ts | 28 ++++++++","  2 files changed"],my);bt.seal(true,"2 files");donePlan(0);
    if(runId!==my)return;setPlan([1,2],"prog");
    const r1=teammateActor("reviewer","#r1","correctness & security pass");
    const r2=teammateActor("reviewer","#r2","coverage pass");
    await Promise.all([(async()=>{for(const t of [["read","tokens.ts"],["grep","timing|secret"],["lsp","diagnostics"]]){const s=r1.toolLine(t[0],t[1]);await sleep(rnd(350,600));r1.tail(t[0]);s.className="ts ok";s.removeAttribute("data-spin");s.textContent="✓";}})(),(async()=>{for(const t of [["read","refresh.test.ts"],["grep","it\\(|test\\("]]){const s=r2.toolLine(t[0],t[1]);await sleep(rnd(350,600));r2.tail(t[0]);s.className="ts ok";s.removeAttribute("data-spin");s.textContent="✓";}})()]);
    r1.seal(true,"no blockers");r2.seal(true,"covered");donePlan(1);donePlan(2);
    if(runId!==my)return;setPlan([3],"prog");p=M.prose();await typeInto(p,"No blockers. One nit: name the serialization lock. Coverage holds.",my);donePlan(3);
  }},
  plan:{plan:["scope","design interface","emit waves","confirm"],steps:async(my,M)=>{
    let tb=M.thinking();await typeInto(tb.body,"decompose before executing — scope, interface, waves, then confirm.",my,12);tb.seal(true);
    initPlan(SC.plan.plan);setPlan([0,1],"prog");
    const p1=teammateActor("planner","#p1","scope & design");
    for(const t of [["read","README.md"],["grep","TODO"],["read","src/auth/index.ts"]]){const s=p1.toolLine(t[0],t[1]);await sleep(rnd(320,560));p1.tail(t[0]);s.className="ts ok";s.removeAttribute("data-spin");s.textContent="✓";}
    p1.seal(true,"scoped");donePlan(0);donePlan(1);
    if(runId!==my)return;setPlan([2,3],"prog");
    let p=M.prose();await typeInto(p,"Plan drafted: 3 waves, parallel explorers then serial implement. Confirm to execute.",my);donePlan(2);donePlan(3);
  }},
};
function pick(t){const s=(t||"").toLowerCase();if(/explore|找|trace|搜|map|定义/.test(s))return SC.explore;if(/fix|修|改|写|add|bug|implement|patch|实现/.test(s))return SC.fix;if(/review|审|check|检查|diff/.test(s))return SC.review;if(/plan|计划|todo|拆|decomp/.test(s))return SC.plan;return SC.default;}

/* ---- run ---- */
async function run(sc,intent){
  const my=++runId;
  clearRunTimers();
  stage.querySelectorAll(".msg").forEach(m=>m.remove());
  agRecords.slice().forEach(r=>r.row.remove());agRecords=[];agentsCompact=false;[...$("#agCtl").children].forEach((x,i)=>x.classList.toggle("on",i===0));renderAgents();
  plan=[];todoCompact=false;[...$("#tdCtl").children].forEach((x,i)=>x.classList.toggle("on",i===0));renderTodo();
  toolCount=0;$("#ftools").textContent="0 tools";$("#fcost").textContent="$0.00";$("#felapsed").textContent="00:00";
  $("#ctxfill").style.width="0%";$("#ctxpct").textContent="0%";
  $("#m-run").textContent="#"+my;$("#m-pulse").className="pulse";$("#m-pulse").textContent="running";
  runStart=performance.now();runActive=true;

  userMsg(intent.user);
  curMain=mainActor();curMain.newMsg();
  await sc.steps(my,curMain);
  if(runId!==my)return;

  runActive=false;curMain.settle();$("#m-pulse").className="pulse idle";$("#m-pulse").textContent="idle";
  const c=Math.min(94,18+toolCount*2.2);$("#ctxfill").style.width=c+"%";$("#ctxfill").style.background=c>75?"var(--amber)":c>45?"var(--cyan)":"var(--green)";$("#ctxpct").textContent=Math.round(c)+"%";
}

$("#cmd").addEventListener("keydown",e=>{if(e.key==="Enter"){const v=e.target.value.trim();e.target.value="";const sc=pick(v);run(sc,{user:v||"wire up auth refresh + show the plan"});}});

run(SC.default,{user:"wire up auth refresh + show the plan"});

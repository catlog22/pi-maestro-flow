<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Pi Browser Bridge</title>
    <style>
      body { font: 13px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; margin: 12px; min-width: 220px; }
      h1 { font-size: 14px; margin: 0 0 8px; }
      #status { font-weight: bold; margin-bottom: 10px; }
      label { display: block; margin-top: 8px; }
      input { width: 100%; box-sizing: border-box; padding: 4px; margin-top: 2px; }
      button { margin-top: 10px; padding: 6px 12px; cursor: pointer; }
      .hint { color: #666; font-size: 11px; margin-top: 8px; }
    </style>
  </head>
  <body>
    <h1>Pi Browser Bridge</h1>
    <div id="status">状态: 查询中…</div>
    <label>WS 端口 (默认 19222)
      <input id="port" type="number" min="1" max="65535" />
    </label>
    <button id="save">保存并重连</button>
    <div class="hint">改端口后需在 pi 侧用 PI_BROWSER_BRIDGE_PORT 匹配，或让 pi 自动探测实际监听端口（见 ~/.pi/browser-bridge.port）。</div>
    <script src="popup.js"></script>
  </body>
</html>
